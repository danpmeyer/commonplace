<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="#8f2310"/>

  <!-- Book stack, centered: total height ~78px (y=57 to y=135), center=96 ✓ -->

